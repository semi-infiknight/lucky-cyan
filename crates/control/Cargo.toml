[package]
name = "inkue-control"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Reviewable audio cue sheets for Inkue"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
schemars = { version = "1", optional = true }

[features]
schema = ["dep:schemars"]
